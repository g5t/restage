[build-system]
requires = ["setuptools>=60", "setuptools_scm>=8.0", "tox>=4.0"]
build-backend = "setuptools.build_meta"

[project]
name = "restage"
dependencies = [
    'zenlog>=1.1',
    'platformdirs>=3.11',
    'confuse',
    'psutil>=5.9.6',
    'mccode-antlr>=0.21.0',
    'sqlmodel>=0.0.18',
    'tqdm>=4.0',
]
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.11"
authors = [
    { name = "Gregory Tucker", email = "gregory.tucker@ess.eu" },
]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]

[project.optional-dependencies]
# chopcal is the oracle for the chopper arithmetic, not a component: test/test_energy.py
# and test/test_constants.py assert restage agrees with it to the last bit. Unpinned on
# purpose -- a chopcal that changes a constant *should* turn this suite red.
test = ["pytest", "chopcal>=0.5.1"]

[project.scripts]
splitrun = "restage.splitrun:entrypoint"
nosplitrun = "restage.nosplitrun:entrypoint"
restage_bifrost_choppers = "restage.bifrost_choppers:script"

[tool.setuptools_scm]

[tool.tox]
legacy_tox_ini = """
    [tox]
    min_version = 4.0
    env_list =
        py314
        py313
        py312
        py311
        type

    [testenv]
    deps =
        pytest
        chopcal
    commands = pytest test

    [testenv:type]
    deps =
        mypy
        types-PyYAML
    commands = mypy src
"""
